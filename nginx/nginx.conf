worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream backend {
        server lumiroom-backend:8080;  # Backend service (ensure it matches your Docker service name)
    }

    # HTTP server (80) for ACME challenge & backend access
    server {
        listen 80;
        server_name lumiroom.duckdns.org;

        # Allow Let's Encrypt ACME challenge to be served
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to backend (proxy to the Spring Boot app)
        location / {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
