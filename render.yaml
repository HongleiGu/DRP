# render.yaml - deploys Spring Boot with Docker Compose, Maven build in subdirectory

services:
  - type: web
    name: echospace-backend
    env: docker
    plan: free
    repo: https://github.com/yourusername/echospace
    branch: main
    buildCommand: |
      # Navigate to backend folder and build Spring Boot
      cd backend/echospace
      mvn clean package
      # Go back to repo root and build Docker images
      cd ../../
      docker-compose build
    startCommand: |
      docker-compose up --remove-orphans
    autoDeploy: true
